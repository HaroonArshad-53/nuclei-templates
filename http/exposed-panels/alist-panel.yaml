id: alist-panel

info:
  name: Alist - Panel
  author: HaroonArshad-53
  severity: info
  description: |
    Alist is an open-source file list program that supports multiple storage providers, with a web-based interface. An exposed panel means the Alist web UI is reachable from the network; the login page serves Alist's SPA shell (title, generator meta and window.ALIST bootstrap) without authentication.
  reference:
    - https://alist.nn.ci/
    - https://github.com/AlistGo/alist
  metadata:
    verified: true
    max-request: 1
    vendor: alist
    product: alist
    shodan-query: http.html:"AList V3"
    fofa-query: body="AList V3"
    google-query: '"AList V3" "window.ALIST"'
  tags: panel,alist,file-sharing,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/@login"

    matchers:
      - type: dsl
        dsl:
          - 'status_code == 200'
          - 'contains(body, "<title>AList</title>")'
          - 'contains(body, "content=\"AList V3\"")'
          - 'contains(body, "window.ALIST = {")'
        condition: and
